name: no-std
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ACC_RSS_LIBS: "/home/runner/work/a121-sys/a121-sys/staticlibs"

jobs:
  nostd:
    runs-on: ubuntu-latest
    name: ${{ matrix.target }}
    strategy:
      matrix:
        target: [thumbv7em-none-eabihf, thumbv8m.main-none-eabihf]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the Arm toolchain
        timeout-minutes: 10
        run: |
          # Skip rebuilding the man page index, which makes installs slow on the runners.
          # A short timeout retries stalled mirror downloads instead of waiting on them.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Create lib directory
        run: mkdir -p "$ACC_RSS_LIBS"

      - name: cargo check
        run: cargo check --target ${{ matrix.target }} --features="stub_library,distance,presence"
        env:
          RUSTFLAGS: "-C link-arg=-nostartfiles"

      # Upload build logs on failure
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            target/thumbv7em-none-eabihf/debug/build/*/output
            target/thumbv7em-none-eabihf/debug/build/*/stderr